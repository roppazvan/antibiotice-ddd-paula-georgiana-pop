body {

  padding: 48px 20px 32px;

  transform: translateX(-50%);
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(108,92,231,.2) 0%, transparent 70%);
  pointer-events: none;
}
.header h1 {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 800;
  background: linear-gradient(135deg, #e4e6f0 0%, #a29bfe 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.header .sub {
  color: var(--text2);
  font-size: clamp(.8rem, 2.5vw, .95rem);

/* Navigation tabs */
.nav {
  display: flex;
  gap: 6px;
  background: var(--surface);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav-btn {
  flex: 1;
  min-width: max-content;
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text2);
  font-family: inherit;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;

.nav-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 12px rgba(108,92,231,.4);
}
.nav-btn:hover:not(.active) { color: var(--text); background: var(--surface2); }

/* Sections */
.section { display: none; }
.section.active { display: block; }

/* KPI Grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  text-align: center;
  transition: transform .2s, box-shadow .2s;
}
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kpi .icon { font-size: 1.5rem; margin-bottom: 8px; }
.kpi .label { font-size: .7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.kpi .val { font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 800; margin: 4px 0; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: .72rem; color: var(--text2); }
.kpi.up .val { color: var(--red); }
.kpi.down .val { color: var(--green); }
.kpi.neutral .val { color: var(--text); }
.kpi.accent .val { color: var(--accent2); }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);

.card h3 {

.badge-blue { background: var(--blue-soft); color: var(--blue); }
.badge-purple { background: rgba(162,155,254,.12); color: var(--purple); }

.grid-2 {

  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

.table-wrap {

  border-radius: var(--radius-sm);
  border: 1px solid var(--border);

table {

th {

td {

.drug-table-wrap::-webkit-scrollbar-track { background: var(--surface); }
.drug-table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Search */
.search-box {
  width: 100%;

  border: 1px solid var(--border);

/* Footer */

/* Mobile tweaks */

  .card { padding: 14px; }
  table { font-size: .72rem; }
  th, td { padding: 8px 10px; }
  .nav-btn { padding: 8px 12px; font-size: .75rem; }
}

const fmt = n => n==null?'—':n.toLocaleString('ro-RO',{maximumFractionDigits:2});
const fmtPct = n => n==null?'—':n.toFixed(1).replace('.',',')+' %';
const pillFor = (ch) => ch==null?'':'<span class="pill '+(Math.abs(ch)<5?'pill-flat':ch>0?'pill-up':'pill-down')+'">'+(ch>0?'+':'')+fmtPct(ch)+'</span>';

// ===== OVERVIEW TAB =====
let ov = '';
ov += `<div class="kpi-grid">
  <div class="kpi neutral"><div class="icon">📊</div><div class="label">Total DDD 2024</div><div class="val">${fmt(total24)}</div></div>
  <div class="kpi accent"><div class="icon">📈</div><div class="label">Total DDD 2025</div><div class="val">${fmt(total25)}</div></div>
  <div class="kpi ${totalChange>0?'up':'down'}"><div class="icon">${totalChange>0?'🔺':'🔽'}</div><div class="label">Variație 2025 vs 2024</div><div class="val">${totalChange>0?'+':''}${fmtPct(totalChange)}</div></div>
  <div class="kpi ${resPct25>5.4?'up':'down'}"><div class="icon">🛡️</div><div class="label">% Rezervă 2025</div><div class="val">${fmtPct(resPct25)}</div><div class="sub">Media UE: 5,4 %</div></div>
  <div class="kpi ${carbPct25>carbPct24?'up':'down'}"><div class="icon">⚠️</div><div class="label">% Carbapeneme 2025</div><div class="val">${fmtPct(carbPct25)}</div><div class="sub">2024: ${fmtPct(carbPct24)}</div></div>
</div>`;

ov += `<div class="grid-2">`;
ov += `<div class="card"><h3>Distribuție pe Grupe — Spital vs Media UE <span class="badge badge-blue">2025</span></h3><canvas id="chartGroupsOV" height="300"></canvas></div>`;
ov += `<div class="card"><h3>DDD pe Grupe — 2024 vs 2025 <span class="badge badge-purple">Comparație</span></h3><canvas id="chartYearsOV" height="300"></canvas></div>`;
ov += `</div>`;
ov += `<div class="grid-2">`;
ov += `<div class="card"><h3>Antibiotice de Rezervă — 2024 vs 2025</h3><canvas id="chartResOV" height="300"></canvas></div>`;
ov += `<div class="card"><h3>Top 15 Variații DDD (2025 − 2024)</h3><canvas id="chartChangesOV" height="300"></canvas></div>`;
ov += `</div>`;
document.getElementById('overview').innerHTML = ov;

// ===== GROUPS vs EU TAB =====
const gNames = Object.keys(groups).sort((a,b)=>groups[b].ddd25-groups[a].ddd25);
let gt = '<div class="card"><h3>Distribuție Procentuală pe Grupe — Spital 2024, 2025 vs Media UE 2023</h3>';
gt += '<div class="table-wrap"><table><thead><tr><th>Grupă Terapeutică</th><th class="num">% Spital 2024</th><th class="num">% Spital 2025</th><th class="num" style="color:#0984e3">% Media UE 2023</th><th class="num">Diferență (2025 − UE)</th></tr></thead><tbody>';

gNames.forEach(g => {
  const p24 = groups[g].ddd24/total24*100;
  const p25 = groups[g].ddd25/total25*100;
  let euPct = euDistribution[g];
  let euStr, diffStr;
  if(g==='Carbapeneme') {
    // At EU level, carbapenems are included in J01D
    euStr = '<span style="color:var(--text3);font-size:.72rem">incl. în Cefalosp.</span>';
    diffStr = '—';
  } else {
    euStr = `<span class="pill pill-eu">${fmtPct(euPct)}</span>`;
    const diff = p25 - euPct;
    diffStr = pillFor(diff);
  }
  gt += `<tr>
    <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${groupColors[g]||'#666'};margin-right:8px;vertical-align:middle"></span>${g}</td>
    <td class="num">${fmtPct(p24)}</td>
    <td class="num" style="font-weight:600">${fmtPct(p25)}</td>
    <td class="num eu-highlight">${euStr}</td>
    <td class="num">${diffStr}</td>
  </tr>`;
});
gt += `<tr style="font-weight:700"><td>TOTAL</td><td class="num">100 %</td><td class="num">100 %</td><td class="num eu-highlight">100 %</td><td class="num">—</td></tr>`;
gt += '</tbody></table></div></div>';
gt += '<div class="card"><h3>Grafic Comparativ — Distribuție pe Grupe</h3><canvas id="chartGroupDetail" height="350"></canvas></div>';
document.getElementById('groups').innerHTML = gt;

// ===== DRUGS TAB =====
let dt = '';
dt += '<div class="search-wrap"><input class="search-box" id="drugSearch" placeholder="Caută antibiotic..." oninput="filterDrugs()"></div>';
dt += '<div class="card" style="padding:0"><div class="drug-table-wrap"><table id="drugTable"><thead><tr>';
dt += '<th>Nr.</th><th>Antibiotic</th><th>Grupă</th><th class="num">DDD 2024</th><th class="num">DDD 2025</th><th class="num">Variație 2025 vs 2024</th>';
dt += '</tr></thead><tbody>';

const sorted = [...drugs].sort((a,b)=>Math.max(b.ddd24||0,b.ddd25||0)-Math.max(a.ddd24||0,a.ddd25||0));
sorted.forEach((d,i) => {
  const ch = (d.ddd24&&d.ddd25) ? ((d.ddd25-d.ddd24)/d.ddd24*100) : null;
  const resTag = d.reserve ? ' <span class="pill pill-reserve">REZERVĂ</span>' : '';
  dt += `<tr class="drug-row" data-name="${d.name.toLowerCase()}">
    <td class="center">${i+1}</td>
    <td>${d.name}${resTag}</td>
    <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${groupColors[d.group]||'#666'};margin-right:6px;vertical-align:middle"></span>${d.group}</td>
    <td class="num">${d.ddd24!=null?fmt(d.ddd24):'—'}</td>
    <td class="num" style="font-weight:600">${d.ddd25!=null?fmt(d.ddd25):'—'}</td>
    <td class="num">${pillFor(ch)}</td>
  </tr>`;
});
dt += '</tbody></table></div></div>';
document.getElementById('drugs').innerHTML = dt;

// ===== RESERVE TAB =====
const resDrugs = drugs.filter(d=>d.reserve).sort((a,b)=>(b.ddd25||0)-(a.ddd25||0));
let rt = '';
rt += `<div class="kpi-grid" style="margin-bottom:20px">
  <div class="kpi neutral"><div class="label">DDD Rezervă 2024</div><div class="val">${fmt(res24)}</div><div class="sub">${fmtPct(resPct24)} din total</div></div>
  <div class="kpi accent"><div class="label">DDD Rezervă 2025</div><div class="val">${fmt(res25)}</div><div class="sub">${fmtPct(resPct25)} din total</div></div>
  <div class="kpi ${resPct25>5.4?'up':'down'}"><div class="label">Media UE — % Rezervă</div><div class="val">5,4 %</div><div class="sub">ECDC 2023</div></div>
</div>`;
rt += '<div class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>Antibiotic</th><th>Grupă</th><th class="num">DDD 2024</th><th class="num">DDD 2025</th><th class="num">Variație 2025 vs 2024</th></tr></thead><tbody>';
resDrugs.forEach(d => {
  const ch = (d.ddd24&&d.ddd25) ? ((d.ddd25-d.ddd24)/d.ddd24*100) : null;
  rt += `<tr><td style="font-weight:600">${d.name}</td><td>${d.group}</td><td class="num">${d.ddd24!=null?fmt(d.ddd24):'—'}</td><td class="num" style="font-weight:600">${d.ddd25!=null?fmt(d.ddd25):'—'}</td><td class="num">${pillFor(ch)}</td></tr>`;
});
rt += '</tbody></table></div></div>';
rt += '<div class="card" style="margin-top:16px"><h3>Grafic Antibiotice de Rezervă</h3><canvas id="chartResFull" height="350"></canvas></div>';
document.getElementById('reserve').innerHTML = rt;

// ===== SOURCES TAB =====
document.getElementById('sources').innerHTML = `
<div class="sources">
  <h3>Metodologie</h3>
  <p style="color:var(--text2);font-size:.85rem;line-height:1.8;margin-bottom:20px">
    <strong style="color:var(--text)">Formula de calcul:</strong> DDD = Cantitatea totală eliberată (unități) × Doză per unitate (g) ÷ DDD OMS (g)<br>
    Valorile DDD OMS sunt conform WHO ATC/DDD Index 2025. Pentru combinații (amoxicilină+acid clavulanic, piperacilină+tazobactam etc.), DDD se referă la componenta antibiotică principală.
  </p>
  <h3>Surse</h3>
  <ol>
    <li>ECDC ESAC-Net Annual Epidemiological Report 2023 — Antimicrobial consumption in the EU/EEA<br><a href="https://www.ecdc.europa.eu/en/publications-data/antimicrobial-consumption-eueea-esac-net-annual-epidemiological-report-2023" target="_blank">ecdc.europa.eu/.../annual-epidemiological-report-2023</a></li>
    <li>ECDC ESAC-Net Annual Epidemiological Report 2024<br><a href="https://www.ecdc.europa.eu/en/publications-data/antimicrobial-consumption-eueea-esac-net-annual-epidemiological-report-2024" target="_blank">ecdc.europa.eu/.../annual-epidemiological-report-2024</a></li>
    <li>ECDC Antimicrobial Consumption Dashboard (ESAC-Net)<br><a href="https://www.ecdc.europa.eu/en/antimicrobial-consumption/surveillance-and-disease-data/database" target="_blank">ecdc.europa.eu/.../database</a></li>
    <li>Zarb P. et al. (2024) Measuring hospital antibiotic consumption in EU/EEA countries. <em>Eurosurveillance</em> 29(46)<br><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11565654/" target="_blank">pmc.ncbi.nlm.nih.gov/articles/PMC11565654</a></li>
    <li>Metodologia determinării DDD — USMF „Nicolae Testemițanu" Chișinău, 2023</li>
    <li>WHO ATC/DDD Index — <a href="https://atcddd.fhi.no/" target="_blank">atcddd.fhi.no</a></li>
  </ol>
  <div class="note">
    <strong>Notă:</strong> Datele UE/SEE sunt exprimate în DDD/1.000 loc./zi (medie ponderată populațional), iar datele spitalului sunt în DDD absolute. Comparația cu media UE se face la nivel de distribuție procentuală pe grupe terapeutice. Media UE nu este disponibilă la nivel de antibiotic individual — ECDC raportează doar pe grupe ATC.
  </div>
</div>`;

// ===== SEARCH FILTER =====
function filterDrugs() {
  const q = document.getElementById('drugSearch').value.toLowerCase();
  document.querySelectorAll('.drug-row').forEach(r => {
    r.style.display = r.dataset.name.includes(q) ? '' : 'none';
  });
}

// ===== CHARTS =====
Chart.defaults.color = '#9498ad';
Chart.defaults.borderColor = '#2e3347';
Chart.defaults.font.family = "'Inter', sans-serif";

// Overview: Groups vs EU
const gLabelsNoCarb = gNames.filter(g=>g!=='Carbapeneme');
const hospPctWithCarb = gLabelsNoCarb.map(g => {
  let v = groups[g].ddd25/total25*100;
  if(g==='Cefalosporine') v += (groups['Carbapeneme']?.ddd25||0)/total25*100;
  return +v.toFixed(1);
});
const euPcts = gLabelsNoCarb.map(g=>euDistribution[g]||0);

function makeGroupEUChart(canvasId) {
  new Chart(document.getElementById(canvasId), {
    type:'bar',
    data:{
      labels:gLabelsNoCarb.map(g=>g.length>16?g.substring(0,16)+'…':g),
      datasets:[
        {label:'Spital 2025',data:hospPctWithCarb,backgroundColor:'rgba(108,92,231,0.7)',borderRadius:6,borderSkipped:false},
        {label:'Media UE 2023',data:euPcts,backgroundColor:'rgba(9,132,227,0.5)',borderRadius:6,borderSkipped:false}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true,pointStyle:'circle'}}},
      scales:{y:{title:{display:true,text:'% din total DDD'},grid:{color:'rgba(46,51,71,.4)'}},x:{grid:{display:false}}}
    }
  });
}
makeGroupEUChart('chartGroupsOV');
makeGroupEUChart('chartGroupDetail');

// Overview: 2024 vs 2025
new Chart(document.getElementById('chartYearsOV'), {
  type:'bar',
  data:{
    labels:gNames.map(g=>g.length>14?g.substring(0,14)+'…':g),
    datasets:[
      {label:'DDD 2024',data:gNames.map(g=>groups[g].ddd24),backgroundColor:'rgba(99,110,114,0.5)',borderRadius:6,borderSkipped:false},
      {label:'DDD 2025',data:gNames.map(g=>groups[g].ddd25),backgroundColor:'rgba(108,92,231,0.7)',borderRadius:6,borderSkipped:false}
    ]
  },
  options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true,pointStyle:'circle'}}},
    scales:{y:{grid:{color:'rgba(46,51,71,.4)'}},x:{grid:{display:false}}}
  }
});

// Overview: Reserve
new Chart(document.getElementById('chartResOV'), {
  type:'bar',
  data:{
    labels:resDrugs.map(d=>d.name.length>20?d.name.substring(0,20)+'…':d.name),
    datasets:[
      {label:'DDD 2024',data:resDrugs.map(d=>d.ddd24||0),backgroundColor:'rgba(99,110,114,0.5)',borderRadius:6,borderSkipped:false},
      {label:'DDD 2025',data:resDrugs.map(d=>d.ddd25||0),backgroundColor:'rgba(255,107,107,0.7)',borderRadius:6,borderSkipped:false}
    ]
  },
  options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true,pointStyle:'circle'}}},
    scales:{x:{grid:{color:'rgba(46,51,71,.4)'}},y:{grid:{display:false}}}
  }
});

// Reserve tab chart
new Chart(document.getElementById('chartResFull'), {
  type:'bar',
  data:{
    labels:resDrugs.map(d=>d.name.length>22?d.name.substring(0,22)+'…':d.name),
    datasets:[
      {label:'DDD 2024',data:resDrugs.map(d=>d.ddd24||0),backgroundColor:'rgba(99,110,114,0.5)',borderRadius:6,borderSkipped:false},
      {label:'DDD 2025',data:resDrugs.map(d=>d.ddd25||0),backgroundColor:'rgba(255,107,107,0.7)',borderRadius:6,borderSkipped:false}
    ]
  },
  options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true,pointStyle:'circle'}}},
    scales:{x:{grid:{color:'rgba(46,51,71,.4)'}},y:{grid:{display:false}}}
  }
});

// Overview: Top 15 changes
const wChange = drugs.filter(d=>d.ddd24&&d.ddd25).map(d=>({...d,abs:d.ddd25-d.ddd24})).sort((a,b)=>Math.abs(b.abs)-Math.abs(a.abs)).slice(0,15);
new Chart(document.getElementById('chartChangesOV'), {
  type:'bar',
  data:{
    labels:wChange.map(d=>d.name.length>22?d.name.substring(0,22)+'…':d.name),
    datasets:[{
      label:'Variație DDD (2025 − 2024)',
      data:wChange.map(d=>d.abs),
      backgroundColor:wChange.map(d=>d.abs>0?'rgba(255,107,107,0.7)':'rgba(0,184,148,0.7)'),
      borderRadius:6,borderSkipped:false
    }]
  },
  options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{x:{grid:{color:'rgba(46,51,71,.4)'}},y:{grid:{display:false}}}
  }
});
</script>
</body>
</html>
